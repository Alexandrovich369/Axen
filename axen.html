<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Axen"/>
<meta name="theme-color" content="#0a0c10"/>
<title>Axen — Gestão de Alugueres</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0c10;--surface:#11141a;--surface2:#181c24;--border:#252a36;
  --accent:#f0b429;--accent2:#e05d44;--green:#3ecf8e;
  --text:#e8eaf0;--muted:#6b7280;--radius:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;}
body{padding-bottom:env(safe-area-inset-bottom);}
.app{max-width:900px;margin:0 auto;padding:20px 14px 100px;}

/* HEADER */
.header{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-top:env(safe-area-inset-top);}
.header-icon{width:44px;height:44px;background:var(--accent);border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0;}
.header h1{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;}
.header p{color:var(--muted);font-size:0.72rem;margin-top:2px;}

/* TABS */
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:var(--radius);padding:4px;margin-bottom:20px;}
.tab{flex:1;padding:10px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all .2s;}
.tab.active{background:var(--accent);color:#000;}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-card .val{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--accent);}
.stat-card .lbl{font-size:0.68rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px;}

/* TOOLBAR */
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.toolbar input,.toolbar select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-family:'DM Mono',monospace;font-size:0.85rem;outline:none;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent);}
.btn-primary{width:100%;background:var(--accent);color:#000;border:none;border-radius:8px;padding:12px;font-family:'Syne',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-family:'Syne',sans-serif;font-weight:600;font-size:0.85rem;cursor:pointer;}
.btn-pdf{background:#1a2e4a;color:#5bb8ff;border:1px solid #2a4a6a;border-radius:8px;padding:8px 16px;font-family:'Syne',sans-serif;font-weight:600;font-size:0.8rem;cursor:pointer;}
.btn-excel{background:#1a2e1a;color:#3ecf8e;border:1px solid #2a4a2a;border-radius:8px;padding:8px 16px;font-family:'Syne',sans-serif;font-weight:600;font-size:0.8rem;cursor:pointer;}

/* CARDS (mobile-friendly instead of table) */
.rental-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.rental-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.rental-driver{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;}
.rental-actions{display:flex;gap:6px;}
.action-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:4px;}
.plate{background:var(--border);border-radius:4px;padding:2px 7px;font-size:0.72rem;letter-spacing:1px;}
.rental-model{color:var(--muted);font-size:0.75rem;margin-top:2px;}
.rental-dates{font-size:0.78rem;color:var(--muted);margin:6px 0;}
.rental-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pill{border-radius:20px;padding:3px 10px;font-size:0.73rem;}
.pill-blue{background:#1a2e4a;color:#5bb8ff;}
.pill-red{background:#2e1a1a;color:var(--accent2);}
.pill-green{background:#1a2a1e;color:var(--green);}
.pill-on{background:#1f2e10;color:#a3e635;}
.pill-off{background:var(--border);color:var(--muted);}
.empty{color:var(--muted);text-align:center;padding:40px;font-size:0.85rem;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;z-index:100;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-height:90vh;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-header h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;}
.close-btn{background:var(--border);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px 12px;font-family:'DM Mono',monospace;font-size:0.9rem;outline:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);}
.duration-badge{background:#1f2e10;color:#a3e635;border-radius:8px;padding:8px 14px;font-size:0.8rem;text-align:center;margin-bottom:14px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn-primary{flex:1;}

/* MONTH SUMMARY */
.month-section{margin-bottom:28px;}
.month-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.month-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;color:var(--accent);}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.82rem;}
.summary-row:last-child{border-bottom:none;}
.summary-name{font-family:'Syne',sans-serif;font-weight:600;}
.summary-car{color:var(--muted);font-size:0.72rem;}
.summary-right{text-align:right;}
.month-total{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:0.85rem;margin-top:8px;}
.month-total strong{color:var(--accent);font-family:'Syne',sans-serif;font-size:1rem;}

/* PDF PREVIEW MODAL */
.pdf-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;}
.pdf-toolbar{background:var(--surface2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;padding-top:calc(14px + env(safe-area-inset-top));}
.pdf-toolbar span{font-family:'Syne',sans-serif;font-weight:700;color:var(--accent);}
.pdf-frame{flex:1;background:#fff;overflow-y:auto;padding:28px 20px;color:#111;font-family:Arial,sans-serif;}
.pdf-frame h1{font-size:1.4rem;font-weight:bold;margin-bottom:4px;}
.pdf-frame .sub{color:#666;font-size:0.78rem;margin-bottom:6px;}
.pdf-frame hr{border:none;border-top:2px solid #1e2533;margin:12px 0 20px;}
.pdf-table{width:100%;border-collapse:collapse;font-size:0.8rem;}
.pdf-table thead tr{background:#1e2533;}
.pdf-table th{color:#fff;padding:10px 12px;text-align:left;font-weight:bold;}
.pdf-table td{padding:10px 12px;border-bottom:1px solid #e5e7eb;}
.pdf-table tr:nth-child(even) td{background:#f8fafc;}
.pdf-total{margin-top:16px;font-weight:bold;font-size:0.9rem;padding:12px;background:#f0f4f8;border-left:4px solid #1e2533;}
.pdf-footer{margin-top:20px;color:#999;font-size:0.72rem;font-style:italic;}
.btn-share{background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 18px;font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;cursor:pointer;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-icon">🚗</div>
    <div>
      <h1>Axen</h1>
      <p>Gestão de Alugueres de Viaturas</p>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('rentals')">Alugueres</button>
    <button class="tab" onclick="showTab('summary')">Resumo Mensal</button>
  </div>
  <div id="tab-rentals"></div>
  <div id="tab-summary" style="display:none"></div>
</div>

<!-- FORM MODAL -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modal-title">Novo Aluguer</h2>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>
    <div class="form-group">
      <label>Viatura</label>
      <select id="f-car"></select>
    </div>
    <div class="form-group">
      <label>Condutor *</label>
      <input type="text" id="f-driver" placeholder="Nome completo" oninput="updateDuration()"/>
    </div>
    <div class="form-group">
      <label>Data de Início *</label>
      <input type="date" id="f-start" oninput="updateDuration()"/>
    </div>
    <div class="form-group">
      <label>Data de Fim</label>
      <input type="date" id="f-end" oninput="updateDuration()"/>
    </div>
    <div class="form-group">
      <label>Multas (€)</label>
      <input type="number" id="f-fines" min="0" step="0.01" placeholder="0.00"/>
    </div>
    <div class="form-group">
      <label>Combustível não reabastecido (€)</label>
      <input type="number" id="f-fuel" min="0" step="0.01" placeholder="0.00"/>
    </div>
    <div class="form-group">
      <label>Notas</label>
      <textarea id="f-notes" rows="2" placeholder="Observações..."></textarea>
    </div>
    <div class="duration-badge" id="duration-badge" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeForm()">Cancelar</button>
      <button class="btn-primary" onclick="saveRental()">Guardar</button>
    </div>
  </div>
</div>

<!-- PDF PREVIEW MODAL -->
<div class="pdf-modal" id="pdf-modal" style="display:none">
  <div class="pdf-toolbar">
    <span id="pdf-title">Resumo</span>
    <div style="display:flex;gap:8px;">
      <button class="btn-share" onclick="sharePDF()">⬆ Partilhar</button>
      <button class="btn-secondary" onclick="closePDF()" style="padding:8px 14px;">✕</button>
    </div>
  </div>
  <div class="pdf-frame" id="pdf-frame"></div>
</div>

<script>
const CARS = [
  {id:1, plate:"DP-274-AW", model:"Peugeot"},
  {id:2, plate:"EE-848-ZG", model:"Citroën Vermelho"},
  {id:3, plate:"DM-219-EL", model:"Citroën DS3"},
  {id:4, plate:"EZ-048-TP", model:"Renault Megane"},
  {id:5, plate:"DM-259-ZZ", model:"Citroën Preto Fromage"},
];

let rentals = JSON.parse(localStorage.getItem("axen_rentals") || "null") || [
  {id:1, carId:3, driver:"João",          startDate:"2026-04-01", endDate:"",           fines:"",    fuelEuros:"",    notes:""},
  {id:2, carId:1, driver:"Luís, Cândido", startDate:"2026-04-01", endDate:"2026-05-13", fines:"",    fuelEuros:"",    notes:""},
  {id:3, carId:2, driver:"Hora",          startDate:"2026-04-01", endDate:"2026-04-16", fines:"",    fuelEuros:"",    notes:""},
  {id:4, carId:5, driver:"Licínio",       startDate:"2026-04-01", endDate:"2026-04-16", fines:"",    fuelEuros:"91.06", notes:""},
  {id:5, carId:4, driver:"Pedro",         startDate:"2026-04-01", endDate:"2026-04-16", fines:"110", fuelEuros:"",    notes:""},
  {id:6, carId:2, driver:"Neto",          startDate:"2026-04-16", endDate:"",           fines:"",    fuelEuros:"",    notes:""},
  {id:7, carId:5, driver:"Pedro",         startDate:"2026-04-16", endDate:"2026-05-10", fines:"",    fuelEuros:"",    notes:""},
  {id:8, carId:5, driver:"Cândido",       startDate:"2026-05-13", endDate:"",           fines:"",    fuelEuros:"",    notes:""},
  {id:9, carId:4, driver:"Fábio",         startDate:"2026-05-03", endDate:"2026-05-17", fines:"",    fuelEuros:"",    notes:""},
];

let editId = null;
let currentTab = "rentals";
let search = "";
let filterCar = "";

function save() { localStorage.setItem("axen_rentals", JSON.stringify(rentals)); }

function diffDays(s, e) {
  if (!s || !e) return 0;
  return Math.max(0, Math.round((new Date(e) - new Date(s)) / 86400000) + 1);
}

function daysInMonth(r, y, m) {
  const ms = new Date(y, m, 1), me = new Date(y, m+1, 0);
  const rs = new Date(r.startDate), re = r.endDate ? new Date(r.endDate) : new Date();
  const s = rs > ms ? rs : ms, e = re < me ? re : me;
  if (s > e) return 0;
  return Math.round((e - s) / 86400000) + 1;
}

function fmtDate(d) {
  if (!d) return "—";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}

function carName(id) {
  const c = CARS.find(c => c.id === id);
  return c ? `${c.plate} – ${c.model}` : "—";
}

function showTab(t) {
  currentTab = t;
  document.querySelectorAll(".tab").forEach((el,i) => el.classList.toggle("active", (i===0&&t==="rentals")||(i===1&&t==="summary")));
  document.getElementById("tab-rentals").style.display = t==="rentals" ? "" : "none";
  document.getElementById("tab-summary").style.display = t==="summary" ? "" : "none";
  render();
}

function render() {
  if (currentTab === "rentals") renderRentals();
  else renderSummary();
}

function renderRentals() {
  const filtered = rentals.filter(r => {
    const txt = (r.driver + " " + carName(r.carId)).toLowerCase();
    return (!search || txt.includes(search.toLowerCase())) && (!filterCar || r.carId === +filterCar);
  }).sort((a,b) => (b.startDate||"").localeCompare(a.startDate||""));

  const totalDays = filtered.reduce((s,r) => s + diffDays(r.startDate, r.endDate), 0);
  const totalFines = filtered.reduce((s,r) => s + Number(r.fines||0), 0);
  const totalFuel = filtered.reduce((s,r) => s + Number(r.fuelEuros||0), 0);

  let carOpts = CARS.map(c => `<option value="${c.id}" ${filterCar==c.id?"selected":""}>${c.plate} – ${c.model}</option>`).join("");

  let cards = filtered.length === 0
    ? `<div class="empty">Sem alugueres. Adiciona o primeiro!</div>`
    : filtered.map(r => {
        const days = diffDays(r.startDate, r.endDate);
        const ongoing = r.startDate && !r.endDate;
        return `
        <div class="rental-card">
          <div class="rental-card-header">
            <div>
              <div class="rental-driver">${r.driver}</div>
              <span class="plate">${CARS.find(c=>c.id===r.carId)?.plate||""}</span>
              <div class="rental-model">${CARS.find(c=>c.id===r.carId)?.model||""}</div>
            </div>
            <div class="rental-actions">
              <button class="action-btn" onclick="editRental(${r.id})">✏️</button>
              <button class="action-btn" onclick="deleteRental(${r.id})">🗑</button>
            </div>
          </div>
          <div class="rental-dates">📅 ${fmtDate(r.startDate)} → ${r.endDate ? fmtDate(r.endDate) : "Em curso"}</div>
          <div class="rental-pills">
            ${days > 0 ? `<span class="pill pill-blue">${days} dias</span>` : ""}
            ${ongoing ? `<span class="pill pill-on">● Em curso</span>` : `<span class="pill pill-off">Terminado</span>`}
            ${r.fines ? `<span class="pill pill-red">Multa €${Number(r.fines).toFixed(2)}</span>` : ""}
            ${r.fuelEuros ? `<span class="pill pill-green">Comb. €${Number(r.fuelEuros).toFixed(2)}</span>` : ""}
          </div>
          ${r.notes ? `<div style="margin-top:8px;font-size:0.75rem;color:var(--muted)">${r.notes}</div>` : ""}
        </div>`;
      }).join("");

  document.getElementById("tab-rentals").innerHTML = `
    <div class="stats">
      <div class="stat-card"><div class="val">${filtered.length}</div><div class="lbl">Alugueres</div></div>
      <div class="stat-card"><div class="val">${totalDays}</div><div class="lbl">Dias Total</div></div>
      <div class="stat-card"><div class="val">€${totalFines.toFixed(0)}</div><div class="lbl">Multas</div></div>
      <div class="stat-card"><div class="val">€${totalFuel.toFixed(0)}</div><div class="lbl">Combustível</div></div>
    </div>
    <div class="toolbar">
      <input type="search" placeholder="🔍 Pesquisar condutor ou matrícula..." value="${search}" oninput="search=this.value;renderRentals()"/>
      <select onchange="filterCar=this.value;renderRentals()">
        <option value="">Todas as viaturas</option>
        ${carOpts}
      </select>
      <button class="btn-primary" onclick="openForm()">+ Novo Aluguer</button>
    </div>
    ${cards}`;
}

function renderSummary() {
  const map = {};
  rentals.forEach(r => {
    if (!r.startDate) return;
    const rStart = new Date(r.startDate);
    const rEnd = r.endDate ? new Date(r.endDate) : new Date();
    const cur = new Date(rStart.getFullYear(), rStart.getMonth(), 1);
    const endMonth = new Date(rEnd.getFullYear(), rEnd.getMonth(), 1);
    while (cur <= endMonth) {
      const key = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}`;
      if (!map[key]) map[key] = {totalDays:0, rows:[]};
      const d = daysInMonth(r, cur.getFullYear(), cur.getMonth());
      map[key].totalDays += d;
      map[key].rows.push({...r, monthDays:d});
      cur.setMonth(cur.getMonth()+1);
    }
  });

  const months = Object.entries(map).sort((a,b) => b[0].localeCompare(a[0]));
  if (!months.length) {
    document.getElementById("tab-summary").innerHTML = `<div class="empty">Sem dados para resumo mensal.</div>`;
    return;
  }

  let html = "";
  months.forEach(([month, data]) => {
    const [y,m] = month.split("-");
    const label = new Date(y, m-1).toLocaleDateString("pt-PT", {month:"long", year:"numeric"});
    const labelCap = label.charAt(0).toUpperCase() + label.slice(1);

    const rows = data.rows.map(r => {
      const fines = Number(r.fines||0);
      const fuel = Number(r.fuelEuros||0);
      const divida = fines + fuel;
      return `
        <div class="summary-row">
          <div>
            <div class="summary-name">${r.driver}</div>
            <div class="summary-car">${carName(r.carId)}</div>
            ${divida > 0 ? `<div style="font-size:0.72rem;margin-top:2px;">
              ${fines>0?`<span class="pill pill-red" style="margin-right:4px;">Multa €${fines.toFixed(2)}</span>`:""}
              ${fuel>0?`<span class="pill pill-green">Comb. €${fuel.toFixed(2)}</span>`:""}
            </div>` : ""}
          </div>
          <div class="summary-right">
            <span class="pill pill-blue">${r.monthDays}d</span>
            ${divida > 0 ? `<div style="font-size:0.78rem;color:var(--accent2);margin-top:4px;">€${divida.toFixed(2)}</div>` : ""}
          </div>
        </div>`;
    }).join("");

    html += `
      <div class="month-section">
        <div class="month-header-row">
          <span class="month-title">${labelCap}</span>
          <div style="display:flex;gap:6px;">
            <button class="btn-pdf" onclick="showPDF('${month}')">📄 Ver Resumo</button>
            <button class="btn-excel" onclick="exportExcel('${month}')">📊 Excel</button>
          </div>
        </div>
        <div class="summary-card">${rows}</div>
        <div class="month-total">Total de dias em ${label}: <strong>${data.totalDays} dias</strong></div>
      </div>`;
  });

  document.getElementById("tab-summary").innerHTML = html;
}

// PDF PREVIEW
let currentPDFContent = "";

function showPDF(month) {
  const [y,m] = month.split("-");
  const label = new Date(y, m-1).toLocaleDateString("pt-PT", {month:"long", year:"numeric"});
  const labelCap = label.charAt(0).toUpperCase() + label.slice(1);

  const map = {};
  rentals.forEach(r => {
    if (!r.startDate) return;
    const rStart = new Date(r.startDate);
    const rEnd = r.endDate ? new Date(r.endDate) : new Date();
    const cur = new Date(rStart.getFullYear(), rStart.getMonth(), 1);
    const endMonth = new Date(rEnd.getFullYear(), rEnd.getMonth(), 1);
    while (cur <= endMonth) {
      const key = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}`;
      if (!map[key]) map[key] = {totalDays:0, rows:[]};
      const d = daysInMonth(r, cur.getFullYear(), cur.getMonth());
      map[key].totalDays += d;
      map[key].rows.push({...r, monthDays:d});
      cur.setMonth(cur.getMonth()+1);
    }
  });

  const data = map[month];
  if (!data) return;

  const tableRows = data.rows.map(r => {
    const fines = Number(r.fines||0);
    const fuel = Number(r.fuelEuros||0);
    const divida = fines + fuel;
    return `<tr>
      <td>${r.driver}</td>
      <td>${carName(r.carId)}</td>
      <td>€${fines.toFixed(2)}</td>
      <td>€${fuel.toFixed(2)}</td>
      <td>€${divida.toFixed(2)}</td>
      <td>${r.monthDays}</td>
    </tr>`;
  }).join("");

  currentPDFContent = `
    <h1>Resumo ${labelCap}</h1>
    <p class="sub">Relatório de utilização das viaturas e controlo de dias trabalhados</p>
    <hr/>
    <table class="pdf-table">
      <thead><tr>
        <th>Nome</th><th>Viatura</th><th>Multas (€)</th><th>Combustível (€)</th><th>Total dívida (€)</th><th>Dias de ${label.split(" ")[0]}</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <p class="pdf-total">Total de dias contabilizados em ${label}: ${data.totalDays} dias</p>
    <p class="pdf-footer">Documento gerado automaticamente para controlo interno de frota e utilização das viaturas.</p>`;

  document.getElementById("pdf-title").textContent = labelCap;
  document.getElementById("pdf-frame").innerHTML = currentPDFContent;
  document.getElementById("pdf-modal").style.display = "flex";
}

function closePDF() {
  document.getElementById("pdf-modal").style.display = "none";
}

async function sharePDF() {
  const title = document.getElementById("pdf-title").textContent;
  // Build a full printable HTML page
  const printHTML = `<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width"/>
<title>Resumo ${title}</title>
<style>
  @media print { body { -webkit-print-color-adjust: exact; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; padding: 32px; color: #111; background: #fff; }
  h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 4px; }
  .sub { color: #666; font-size: 0.8rem; margin-bottom: 6px; }
  hr { border: none; border-top: 2px solid #1e2533; margin-bottom: 20px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  thead tr { background: #1e2533; color: #fff; }
  th { padding: 10px 12px; text-align: left; font-size: 0.82rem; font-weight: bold; }
  td { padding: 10px 12px; font-size: 0.82rem; border-bottom: 1px solid #e5e7eb; }
  tr:nth-child(even) td { background: #f8fafc; }
  .total-row { margin-top: 20px; font-size: 0.95rem; font-weight: bold; padding: 12px; background: #f0f4f8; border-left: 4px solid #1e2533; }
  .footer { margin-top: 24px; color: #999; font-size: 0.72rem; font-style: italic; }
</style>
</head>
<body>
${document.getElementById("pdf-frame").innerHTML}
</body>
</html>`;
  
  const blob = new Blob([printHTML], { type: "text/html" });
  const file = new File([blob], title.replace(/ /g,"_") + ".html", { type: "text/html" });
  
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Resumo " + title });
      return;
    } catch(e) {}
  }
  // Fallback: open print dialog
  const url = URL.createObjectURL(blob);
  const w = window.open(url, "_blank");
  if (w) { w.onload = () => { w.print(); }; }
  else { window.location.href = url; }
}

// EXCEL EXPORT
function exportExcel(month) {
  const [y, m] = month.split("-");
  const label = new Date(y, m - 1).toLocaleDateString("pt-PT", { month: "long", year: "numeric" });
  const labelCap = label.charAt(0).toUpperCase() + label.slice(1);
  const monthName = new Date(y, m - 1).toLocaleDateString("pt-PT", { month: "long" });

  // Build same data map as showPDF
  const map = {};
  rentals.forEach(r => {
    if (!r.startDate) return;
    const rStart = new Date(r.startDate);
    const rEnd = r.endDate ? new Date(r.endDate) : new Date();
    const cur = new Date(rStart.getFullYear(), rStart.getMonth(), 1);
    const endMonth = new Date(rEnd.getFullYear(), rEnd.getMonth(), 1);
    while (cur <= endMonth) {
      const key = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}`;
      if (!map[key]) map[key] = { totalDays: 0, rows: [] };
      const d = daysInMonth(r, cur.getFullYear(), cur.getMonth());
      map[key].totalDays += d;
      map[key].rows.push({ ...r, monthDays: d });
      cur.setMonth(cur.getMonth() + 1);
    }
  });

  const data = map[month];
  if (!data) return;

  const wb = XLSX.utils.book_new();
  const ws = {};
  const merges = [];

  // Row 1: Title "Resumo Abril 2026"
  ws["A1"] = { v: `Resumo ${labelCap}`, t: "s" };
  merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: 4 } });

  // Row 2: empty
  // Row 3: Subtitle
  ws["A3"] = { v: "Relatório de utilização das viaturas e controlo de dias trabalhados", t: "s" };
  merges.push({ s: { r: 2, c: 0 }, e: { r: 2, c: 4 } });

  // Row 4: empty

  // Row 5: Header
  const headers = ["Nome", "Viatura", "Matrícula", `Total dívida (€)`, `Total dias de ${monthName}`];
  headers.forEach((h, i) => {
    const cell = XLSX.utils.encode_cell({ r: 4, c: i });
    ws[cell] = { v: h, t: "s" };
  });

  // Data rows starting at row 6
  data.rows.forEach((r, idx) => {
    const car = CARS.find(c => c.id === r.carId);
    const fines = Number(r.fines || 0);
    const fuel = Number(r.fuelEuros || 0);
    const divida = fines + fuel;
    const rowData = [
      r.driver,
      car ? car.model : "",
      "", // Matrícula (blank as in reference)
      divida,
      r.monthDays,
    ];
    rowData.forEach((val, ci) => {
      const cell = XLSX.utils.encode_cell({ r: 5 + idx, c: ci });
      ws[cell] = { v: val, t: typeof val === "number" ? "n" : "s" };
    });
  });

  const totalRow = 5 + data.rows.length + 1;
  ws[XLSX.utils.encode_cell({ r: totalRow, c: 0 })] = {
    v: `Total de dias contabilizados em ${monthName}: ${data.totalDays} dias`,
    t: "s",
  };
  merges.push({ s: { r: totalRow, c: 0 }, e: { r: totalRow, c: 4 } });

  const footerRow = totalRow + 2;
  ws[XLSX.utils.encode_cell({ r: footerRow, c: 0 })] = {
    v: "Documento gerado automaticamente para controlo interno de frota e utilização das viaturas.",
    t: "s",
  };
  merges.push({ s: { r: footerRow, c: 0 }, e: { r: footerRow, c: 4 } });

  ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: footerRow, c: 4 } });
  ws["!merges"] = merges;
  ws["!cols"] = [{ wch: 20 }, { wch: 24 }, { wch: 14 }, { wch: 18 }, { wch: 22 }];

  XLSX.utils.book_append_sheet(wb, ws, labelCap);
  XLSX.writeFile(wb, `Resumo_${labelCap.replace(/ /g, "_")}.xlsx`);
}

// FORM
function openForm(id) {
  editId = id || null;
  const r = id ? rentals.find(x => x.id === id) : null;
  document.getElementById("modal-title").textContent = r ? "Editar Aluguer" : "Novo Aluguer";
  const carSel = document.getElementById("f-car");
  carSel.innerHTML = CARS.map(c => `<option value="${c.id}" ${r&&r.carId===c.id?"selected":""}>${c.plate} – ${c.model}</option>`).join("");
  document.getElementById("f-driver").value = r?.driver || "";
  document.getElementById("f-start").value = r?.startDate || "";
  document.getElementById("f-end").value = r?.endDate || "";
  document.getElementById("f-fines").value = r?.fines || "";
  document.getElementById("f-fuel").value = r?.fuelEuros || "";
  document.getElementById("f-notes").value = r?.notes || "";
  updateDuration();
  document.getElementById("modal").style.display = "flex";
}

function closeForm() { document.getElementById("modal").style.display = "none"; }
function closeModal(e) { if (e.target.id === "modal") closeForm(); }

function updateDuration() {
  const s = document.getElementById("f-start").value;
  const e = document.getElementById("f-end").value;
  const badge = document.getElementById("duration-badge");
  if (s && e) {
    const d = diffDays(s, e);
    badge.textContent = `⏱ ${d} dias de aluguer`;
    badge.style.display = "";
  } else {
    badge.style.display = "none";
  }
}

function saveRental() {
  const driver = document.getElementById("f-driver").value.trim();
  const startDate = document.getElementById("f-start").value;
  const carId = +document.getElementById("f-car").value;
  if (!driver || !startDate || !carId) { alert("Preenche o condutor e a data de início."); return; }
  const r = {
    id: editId || Date.now(),
    carId, driver,
    startDate,
    endDate: document.getElementById("f-end").value,
    fines: document.getElementById("f-fines").value,
    fuelEuros: document.getElementById("f-fuel").value,
    notes: document.getElementById("f-notes").value,
  };
  if (editId) rentals = rentals.map(x => x.id === editId ? r : x);
  else rentals.push(r);
  save();
  closeForm();
  render();
}

function editRental(id) { openForm(id); }

function deleteRental(id) {
  if (!confirm("Apagar este registo?")) return;
  rentals = rentals.filter(r => r.id !== id);
  save();
  render();
}

// INIT
render();
